[project]
name = "t32-mcp"
version = "0.1.0"
description = "MCP server for debugging with Lauterbach TRACE32 PowerView on Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "lauterbach-trace32-rcl>=1.1.6,<1.2",
    "psutil>=7",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
t32-mcp = "t32_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t32_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-m "not hw"'
markers = [
    "hw: needs TRACE32 and a free licensed PowerDebug on this machine",
]
